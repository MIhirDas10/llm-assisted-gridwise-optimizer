# Render Blueprint for a live GridWise endpoint.
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> select this repository.
#   3. When prompted, paste the real LLM_API_KEY value (it is not stored here).
#   4. Render builds the Dockerfile and exposes a public HTTPS URL that serves
#      GET /health and POST /optimize-energy.
#
# Note: Render's free instance type sleeps after inactivity, which adds cold-start
# latency to the first request. For judging, use the "starter" instance (below)
# or keep the service warm by pinging /health.

services:
  - type: web
    name: gridwise-optimizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TIMEOUT_SECONDS
        value: "8"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: LLM_API_KEY
        sync: false
