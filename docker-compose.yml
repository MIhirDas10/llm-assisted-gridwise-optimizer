# Container build metadata for the GridWise LLM Energy Optimizer.
#
# Build with:
#   docker build -t gridwise-optimizer:1.0.0 .
#
# Run with:
#   docker run --rm -p 8000:8000 -e LLM_API_KEY="$LLM_API_KEY" \
#     gridwise-optimizer:1.0.0
#
# Health probe:
#   curl http://localhost:8000/health
version: "3.9"

services:
  gridwise-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridwise-optimizer:1.0.0
    container_name: gridwise-optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Secrets are injected at runtime, NEVER baked into the image.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be supplied at runtime}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
